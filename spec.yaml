blueprint:
  id: wax-multi-sig-proposal-builder-and-simulator
  name: Multi-Sig Proposal Builder & Simulator
  tier: 1
  category: security-foundational
  status: refined
  version: "0.5.0"
  last_refined: "2026-10-18"

metadata:
  description: |
    Safe multi-sig proposal simulation for WAX/Antelope — threshold math,
    approval progress, structural risk analysis, and gated execution patterns.
  related_blueprints:
    - wax-permission-visualizer-and-editor
    - wax-safe-key-rotation-assistant
    - wax-secure-key-management-and-privacy-tools
  related_docs:
    - wax-ecosystem-blueprint-catalog/ECOSYSTEM-RESILIENCE.md

invariants:
  - Threshold math is pure and client-side
  - Risks cite triggers
  - Impossible thresholds are flagged high
  - Single-approver configs are flagged high
  - Execution remains a separate confirmed step

features:
  implemented:
    - computeThresholdSnapshot
    - analyzeProposalRisks
    - ThresholdSimulator, ApprovalGraph, RiskAnalysisPanel
    - ProposalBuilder, ExecutionPanel, demo
  planned:
    - Live permission import from chain
    - Batch proposal templates

machine_instructions:
  - Use examples/engines.ts for all threshold and risk logic
  - Verify live permissions on explorer before recommending broadcast
  - Link multi-sig as resilience path when product frontends shut down

technical_requirements:
  framework: Next.js 15 + TypeScript (strict)
  styling: Tailwind CSS
  signing: WharfKit
